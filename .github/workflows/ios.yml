name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14 # ensures Apple Silicon support and latest simulator runtimes

    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4

      - name: ⚖️ Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🔍 Locate latest available iOS runtime and create simulator
        id: create-sim
        run: |
          echo "🔍 Locating latest available iOS runtime..."
          IOS_RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[^)]+' | sort -rV | head -n1)

          if [ -z "$IOS_RUNTIME" ]; then
            echo "❌ No available iOS runtime found."
            xcrun simctl list runtimes
            exit 1
          fi

          echo "✅ Found runtime: $IOS_RUNTIME"

          echo "🔍 Locating iPhone device type..."
          DEVICE_TYPE=$(xcrun simctl list devicetypes | grep "iPhone 15 Pro" | head -n1 | awk -F '[()]' '{print $2}')

          if [ -z "$DEVICE_TYPE" ]; then
            echo "❌ Could not find iPhone device type."
            exit 1
          fi

          echo "✅ Using device type: $DEVICE_TYPE"

          echo "📱 Creating simulator..."
          SIMULATOR_NAME="CI iPhone"
          SIMULATOR_UDID=$(xcrun simctl create "$SIMULATOR_NAME" "$DEVICE_TYPE" "$IOS_RUNTIME")

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "❌ Failed to create simulator."
            exit 1
          fi

          echo "✅ Created simulator: $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> $GITHUB_ENV
          xcrun simctl boot "$SIMULATOR_UDID"
          sleep 10

      - name: 🚀 Build and Test
        run: |
          xcodebuild test \
            -project reccos.xcodeproj \
            -scheme reccos-ios \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath result-bundle \
          | xcpretty && exit ${PIPESTATUS[0]}

      - name: 📦 Upload Test Results (.xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-bundle
          path: result-bundle

      - name: 🌐 Generate Code Coverage Report (text summary)
        if: always()
        run: |
          xcrun xccov view --report --only-targets result-bundle/Logs/Test/*.xcresult > coverage.txt || true

      - name: ⬆️ Upload Code Coverage Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-summary
          path: coverage.txt

      - name: 🚩 Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID"
          xcrun simctl delete "$SIMULATOR_UDID"
